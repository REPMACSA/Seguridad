<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seguridad — Técnico</title>
<style>
  :root { --navy:#1C2B4A; --gold:#C9A24B; --border:#e2e8f0; --text:#1e293b; --muted:#64748b; --light:#F1F5F9; }
  * { box-sizing:border-box; }
  body { font-family:'Segoe UI', Arial, sans-serif; margin:0; padding:0; background:#f1f5f9; color:var(--text); }
  .topbar { background:var(--navy); color:#fff; padding:14px 18px; padding-top:calc(14px + env(safe-area-inset-top,0px)); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .topbar h1 { font-size:16px; margin:0; }
  .topbar-right { display:flex; align-items:center; gap:8px; }
  .topbar a, .topbar button { background:transparent; border:1.5px solid rgba(255,255,255,.5); color:#fff; border-radius:20px; padding:6px 13px; font-size:.75rem; font-weight:700; cursor:pointer; text-decoration:none; }
  .container { max-width:640px; margin:0 auto; padding:16px 14px 60px; }
  .card { background:#fff; border-radius:14px; padding:18px; box-shadow:0 4px 14px rgba(30,27,75,0.06); border:1px solid var(--border); margin-bottom:14px; }
  .card h3 { margin-top:0; color:var(--navy); }
  label { display:block; font-size:13px; font-weight:600; margin-top:12px; margin-bottom:5px; }
  select, input, textarea { width:100%; padding:10px; border:1.5px solid var(--border); border-radius:9px; font-size:15px; font-family:inherit; }
  .tipo-selector { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .tipo-btn { flex:1; min-width:100px; padding:12px 6px; border-radius:10px; border:2px solid var(--border); background:#fff; text-align:center; cursor:pointer; font-weight:700; font-size:12.5px; }
  .tipo-btn.activo.incidente { border-color:#dc2626; background:#fef2f2; color:#991b1b; }
  .tipo-btn.activo.condicion { border-color:#d97706; background:#fffbeb; color:#92400e; }
  .tipo-btn.activo.acto { border-color:#7c3aed; background:#f5f3ff; color:#5b21b6; }
  button.guardar { background:var(--navy); color:#fff; border:none; padding:13px 20px; border-radius:10px; font-weight:700; margin-top:16px; cursor:pointer; width:100%; font-size:15px; }
  button.guardar:disabled { background:#94a3b8; cursor:not-allowed; }
  .resultado { margin-top:10px; font-size:13px; }
  .sin-acceso-box { max-width:420px; margin:80px auto; text-align:center; }
  .tabs { display:flex; gap:7px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { flex:1; min-width:120px; background:#e2e8f0; color:#1f2937; border:none; padding:10px 6px; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer; }
  .tabs button.active { background:var(--navy); color:#fff; }
  .dias-banner { background:linear-gradient(135deg,#0f766e,#14532d); color:#fff; border-radius:14px; padding:18px; text-align:center; margin-bottom:14px; }
  .dias-banner .num { font-size:38px; font-weight:800; line-height:1; }
  .dias-banner .lbl { font-size:12.5px; opacity:.9; margin-top:4px; }
  .item { border-left:5px solid #94a3b8; background:#fff; border-radius:8px; padding:12px 14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
  .item.incidente { border-left-color:#dc2626; }
  .item.condicion { border-left-color:#d97706; }
  .item.acto { border-left-color:#7c3aed; }
  .item.epp { border-left-color:#0369a1; }
  .item-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .item-mat { font-weight:700; font-size:14.5px; }
  .item-id { font-size:10.5px; color:var(--muted); font-family:monospace; }
  .badge { display:inline-block; padding:3px 9px; border-radius:12px; font-size:11px; font-weight:700; color:#fff; margin-top:6px; }
  .item-det { font-size:12.5px; color:var(--muted); margin-top:4px; }
  .accion-box { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
</style>
</head>
<body>

<div class="topbar">
  <h1>🦺 Seguridad</h1>
  <div class="topbar-right">
    <a href="https://repmacsa.github.io/Portal/">🏠 Portal</a>
    <span id="usuarioPortalTxt" style="font-size:.78rem;"></span>
    <button onclick="salirPortal()">🔒 Salir</button>
  </div>
</div>

<div class="container">

  <div id="sinAccesoBox" class="sin-acceso-box" style="display:none;">
    <p style="color:#dc2626;font-weight:600;">🔒 No hay una sesión activa del Portal.</p>
    <p style="font-size:13px;color:#64748b;">Entrá desde el Portal para acceder acá.</p>
    <a href="https://repmacsa.github.io/Portal/" style="display:inline-block;margin-top:8px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:600;">🏠 Ir al Portal</a>
  </div>

  <div id="appBox" style="display:none;">

    <div class="dias-banner">
      <div class="num" id="diasNum">—</div>
      <div class="lbl">días sin accidentes</div>
    </div>

    <div class="tabs">
      <button id="tabReportar" class="active" onclick="mostrarTab('reportar')">⚠️ Reportar</button>
      <button id="tabMisReportes" onclick="mostrarTab('misReportes')">📋 Mis reportes</button>
      <button id="tabPedirEPP" onclick="mostrarTab('pedirEPP')">🦺 Pedir EPP</button>
      <button id="tabMisEPP" onclick="mostrarTab('misEPP')">📦 Mis EPP</button>
    </div>

    <div id="vistaReportar" class="card">
      <h3>¿Qué querés reportar?</h3>
      <div class="tipo-selector">
        <div class="tipo-btn incidente" id="btnIncidente" onclick="elegirTipoReporte('Incidente')">🚑 Incidente</div>
        <div class="tipo-btn condicion" id="btnCondicion" onclick="elegirTipoReporte('Condicion_Insegura')">⚠️ Condición insegura</div>
        <div class="tipo-btn acto" id="btnActo" onclick="elegirTipoReporte('Acto_Inseguro')">🙅 Acto inseguro</div>
      </div>
      <label>Descripción</label>
      <textarea id="descripcionReporte" rows="3" placeholder="Qué pasó o qué viste"></textarea>
      <label>Ubicación (opcional — cliente, obra, dirección)</label>
      <input type="text" id="ubicacionReporte" placeholder="Opcional">
      <button class="guardar" id="btnGuardarReporte" onclick="crearReporte()">Enviar reporte</button>
      <div id="resultadoReporte" class="resultado"></div>
    </div>

    <div id="vistaMisReportes" class="card" style="display:none;">
      <h3>Mis reportes</h3>
      <div id="listaMisReportes"></div>
    </div>

    <div id="vistaPedirEPP" class="card" style="display:none;">
      <h3>Pedir EPP</h3>
      <label>¿Qué elemento necesitás?</label>
      <input type="text" id="elementoEPP" placeholder="Ej: Botines, guantes, casco, arnés">
      <label>Talle (si corresponde)</label>
      <input type="text" id="talleEPP" placeholder="Opcional">
      <label>Motivo</label>
      <select id="motivoEPP">
        <option value="Desgaste">Desgaste / fin de vida útil</option>
        <option value="Rotura">Rotura</option>
        <option value="Primera entrega">Primera entrega</option>
        <option value="Perdida">Pérdida</option>
        <option value="Otro">Otro</option>
      </select>
      <button class="guardar" id="btnGuardarEPP" onclick="crearSolicitudEPP()">Enviar solicitud</button>
      <div id="resultadoEPP" class="resultado"></div>
    </div>

    <div id="vistaMisEPP" class="card" style="display:none;">
      <h3>Mis solicitudes de EPP</h3>
      <div id="listaMisEPP"></div>
    </div>

  </div>
</div>

<script>
let SCRIPT_URL = localStorage.getItem('seguridad_scriptUrl') || 'https://script.google.com/macros/s/AKfycbxKm-oCy470gs7V0MqMcynqF8z9fKZupGM03Ii21Pqkk3g2g7_pn8Xre1D8k3sSBCuY/exec';

const ACCIONES_LECTURA_SEG = ['listarMisReportes', 'listarMisSolicitudesEPP', 'getDiasSinAccidentes', 'getHistorial'];
let escrituraSegEnCurso = false;

function mostrarGuardandoSeg_(mostrar) {
  let el = document.getElementById('guardandoSegOverlay');
  if (mostrar) {
    if (!el) {
      el = document.createElement('div');
      el.id = 'guardandoSegOverlay';
      el.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 20px;border-radius:8px;font-size:12.5px;font-weight:700;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.3);';
      el.textContent = '⏳ Guardando...';
      document.body.appendChild(el);
    }
  } else if (el) el.remove();
}

function api(action, data) {
  const esEscritura = ACCIONES_LECTURA_SEG.indexOf(action) === -1;
  if (esEscritura) {
    if (escrituraSegEnCurso) {
      return Promise.reject(new Error('Ya hay una acción guardándose — esperá un momento antes de repetirlo.'));
    }
    escrituraSegEnCurso = true;
    mostrarGuardandoSeg_(true);
  }
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
    const limpiar = function() {
      delete window[cbName];
      script.remove();
      if (esEscritura) { escrituraSegEnCurso = false; mostrarGuardandoSeg_(false); }
    };
    window[cbName] = function(payload) {
      limpiar();
      if (payload && payload.ok) resolve(payload);
      else reject(new Error((payload && payload.msg) || 'Error desconocido'));
    };
    const url = SCRIPT_URL + '?action=' + encodeURIComponent(action) + '&data=' + encodeURIComponent(JSON.stringify(data || {})) + '&callback=' + cbName;
    const script = document.createElement('script');
    script.src = url;
    script.onerror = function() { limpiar(); reject(new Error('No se pudo conectar')); };
    document.body.appendChild(script);
  });
}

// ══ SESIÓN DEL PORTAL ══
let usuarioPortal = null;
const SESION_TIMEOUT_MS = 5 * 60 * 1000;
let sesionLockTimer = null;

function leerSesionPortal_() {
  try {
    const raw = localStorage.getItem('portal_sesion');
    if (!raw) return null;
    const s = JSON.parse(raw);
    const horas = (Date.now() - s.ts) / (1000 * 60 * 60);
    if (horas > 10) { localStorage.removeItem('portal_sesion'); return null; }
    return s;
  } catch(e) { return null; }
}
function reiniciarTimerSesion_(){
  clearTimeout(sesionLockTimer);
  sesionLockTimer = setTimeout(salirPortal, SESION_TIMEOUT_MS);
}
function activarVigilanciaSesion_(){
  reiniciarTimerSesion_();
  ['click','touchstart','keydown','scroll'].forEach(ev =>
    document.addEventListener(ev, reiniciarTimerSesion_, { passive: true })
  );
}
window.addEventListener('pageshow', function(event){
  if (event.persisted) window.location.reload();
});
function salirPortal() {
  clearTimeout(sesionLockTimer);
  localStorage.removeItem('portal_sesion');
  window.location.href = 'https://repmacsa.github.io/Portal/';
}

function intentarEntrarConPortal() {
  const sesion = leerSesionPortal_();
  if (sesion) {
    usuarioPortal = { nombre: sesion.nombre, rol: sesion.rol };
    document.getElementById('sinAccesoBox').style.display = 'none';
    document.getElementById('appBox').style.display = 'block';
    document.getElementById('usuarioPortalTxt').textContent = '👋 ' + sesion.nombre;
    activarVigilanciaSesion_();
    cargarDiasSinAccidentes();
  } else {
    document.getElementById('sinAccesoBox').style.display = 'block';
  }
}

async function cargarDiasSinAccidentes() {
  try {
    const res = await api('getDiasSinAccidentes', {});
    document.getElementById('diasNum').textContent = (res.dias !== null && res.dias !== undefined) ? res.dias : '—';
  } catch (e) { console.warn('No se pudo cargar días sin accidentes', e); }
}

// ══ NAVEGACIÓN DE TABS ══
function mostrarTab(tab) {
  ['reportar','misReportes','pedirEPP','misEPP'].forEach(t => {
    document.getElementById('vista' + t.charAt(0).toUpperCase() + t.slice(1)).style.display = (t === tab) ? 'block' : 'none';
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).className = (t === tab) ? 'active' : '';
  });
  if (tab === 'misReportes') cargarMisReportes();
  if (tab === 'misEPP') cargarMisEPP();
}

// ══ REPORTAR ══
let tipoReporteElegido = null;
function elegirTipoReporte(tipo) {
  tipoReporteElegido = tipo;
  document.getElementById('btnIncidente').classList.toggle('activo', tipo === 'Incidente');
  document.getElementById('btnCondicion').classList.toggle('activo', tipo === 'Condicion_Insegura');
  document.getElementById('btnActo').classList.toggle('activo', tipo === 'Acto_Inseguro');
}

async function crearReporte() {
  const div = document.getElementById('resultadoReporte');
  if (!tipoReporteElegido) { div.style.color = '#dc2626'; div.innerHTML = '❌ Elegí qué tipo de reporte es.'; return; }
  const descripcion = document.getElementById('descripcionReporte').value.trim();
  if (!descripcion) { div.style.color = '#dc2626'; div.innerHTML = '❌ Contá qué pasó o qué viste.'; return; }
  const ubicacion = document.getElementById('ubicacionReporte').value.trim();
  const btn = document.getElementById('btnGuardarReporte');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    const res = await api('crearReporte', { tipo: tipoReporteElegido, descripcion, ubicacion, tecnico: usuarioPortal.nombre });
    div.style.color = '#166534';
    div.innerHTML = '✅ Reporte enviado (' + res.id + ')';
    document.getElementById('descripcionReporte').value = '';
    document.getElementById('ubicacionReporte').value = '';
    tipoReporteElegido = null;
    ['btnIncidente','btnCondicion','btnActo'].forEach(id => document.getElementById(id).classList.remove('activo'));
  } catch (e) {
    div.style.color = '#dc2626';
    div.innerHTML = '❌ ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar reporte';
  }
}

const LABEL_TIPO = { 'Incidente': '🚑 Incidente', 'Condicion_Insegura': '⚠️ Condición insegura', 'Acto_Inseguro': '🙅 Acto inseguro' };
const CLASE_TIPO = { 'Incidente': 'incidente', 'Condicion_Insegura': 'condicion', 'Acto_Inseguro': 'acto' };
const COLOR_ESTADO_REPORTE = { 'Reportado': '#94a3b8', 'En revisión': '#0ea5e9', 'Cerrado': '#16a34a' };

async function cargarMisReportes() {
  const cont = document.getElementById('listaMisReportes');
  cont.innerHTML = 'Cargando...';
  try {
    const res = await api('listarMisReportes', { tecnico: usuarioPortal.nombre });
    const reportes = res.reportes || [];
    if (!reportes.length) { cont.innerHTML = '<p style="color:var(--muted);font-size:13px;">Todavía no cargaste ningún reporte.</p>'; return; }
    cont.innerHTML = reportes.map(function(r) {
      const color = COLOR_ESTADO_REPORTE[r.Estado] || '#64748b';
      return '<div class="item ' + CLASE_TIPO[r.Tipo] + '">' +
        '<div class="item-top"><div>' +
        '<span style="font-size:11.5px;font-weight:700;">' + LABEL_TIPO[r.Tipo] + '</span><br>' +
        '<div class="item-mat">' + r.Descripcion + '</div>' +
        '<div class="item-id">' + r.ID + ' · ' + r.Fecha_Reporte + '</div>' +
        '</div></div>' +
        (r.Ubicacion ? '<div class="item-det">📍 ' + r.Ubicacion + '</div>' : '') +
        '<span class="badge" style="background:' + color + '">' + r.Estado + '</span>' +
        (r.Accion_Tomada ? '<div class="item-det" style="margin-top:6px;color:#166534;">✅ ' + r.Accion_Tomada + '</div>' : '') +
        '</div>';
    }).join('');
  } catch (e) {
    cont.innerHTML = '<p style="color:#dc2626;">Error: ' + e.message + '</p>';
  }
}

// ══ EPP ══
async function crearSolicitudEPP() {
  const div = document.getElementById('resultadoEPP');
  const elemento = document.getElementById('elementoEPP').value.trim();
  if (!elemento) { div.style.color = '#dc2626'; div.innerHTML = '❌ Indicá qué elemento necesitás.'; return; }
  const talle = document.getElementById('talleEPP').value.trim();
  const motivo = document.getElementById('motivoEPP').value;
  const btn = document.getElementById('btnGuardarEPP');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    const res = await api('crearSolicitudEPP', { elemento, talle, motivo, tecnico: usuarioPortal.nombre });
    div.style.color = '#166534';
    div.innerHTML = '✅ Solicitud enviada (' + res.id + ')';
    document.getElementById('elementoEPP').value = '';
    document.getElementById('talleEPP').value = '';
  } catch (e) {
    div.style.color = '#dc2626';
    div.innerHTML = '❌ ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar solicitud';
  }
}

const COLOR_ESTADO_EPP = { 'Solicitado': '#94a3b8', 'Entregado': '#16a34a' };

async function cargarMisEPP() {
  const cont = document.getElementById('listaMisEPP');
  cont.innerHTML = 'Cargando...';
  try {
    const res = await api('listarMisSolicitudesEPP', { tecnico: usuarioPortal.nombre });
    const solicitudes = res.solicitudes || [];
    if (!solicitudes.length) { cont.innerHTML = '<p style="color:var(--muted);font-size:13px;">Todavía no pediste ningún EPP.</p>'; return; }
    cont.innerHTML = solicitudes.map(function(s) {
      const color = COLOR_ESTADO_EPP[s.Estado] || '#64748b';
      return '<div class="item epp">' +
        '<div class="item-mat">' + s.Elemento + (s.Talle ? ' — talle ' + s.Talle : '') + '</div>' +
        '<div class="item-id">' + s.ID + ' · ' + s.Fecha_Solicitud + '</div>' +
        (s.Motivo ? '<div class="item-det">Motivo: ' + s.Motivo + '</div>' : '') +
        '<span class="badge" style="background:' + color + '">' + s.Estado + '</span>' +
        '</div>';
    }).join('');
  } catch (e) {
    cont.innerHTML = '<p style="color:#dc2626;">Error: ' + e.message + '</p>';
  }
}

intentarEntrarConPortal();
</script>
</body>
</html>
